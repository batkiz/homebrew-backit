name: Check tap
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load the proposed revision for both Mac architectures
        run: |
          brew tap batkiz/backit "$GITHUB_WORKSPACE"
          brew trust --tap batkiz/backit
          brew readall --os=sequoia --arch=all batkiz/backit
      - name: Install a formula and a cask
        run: |
          brew install batkiz/backit/redis-viewer
          redis-viewer --help
          mkdir -p "$RUNNER_TEMP/Applications"
          brew install --cask --appdir="$RUNNER_TEMP/Applications" batkiz/backit/wake
          test -d "$RUNNER_TEMP/Applications/Wake.app"
