name: Update Homebrew packages
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-homebrew-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check upstream versions and update package definitions
        shell: bash
        run: |
          brew tap batkiz/backit "$GITHUB_WORKSPACE"
          brew trust --tap batkiz/backit
          results="$RUNNER_TEMP/livecheck.json"
          failed=0
          brew livecheck --tap=batkiz/backit --newer-only --json > "$results" || failed=1
          python3 .github/scripts/update-tap.py "$results" "$(brew --repository batkiz/backit)" || failed=1

          if ! git diff --quiet -- Casks Formula; then
            # Validate exactly the files that will be pushed, including after a partial update.
            tap_dir="$(brew --repository batkiz/backit)"
            cp Casks/*.rb "$tap_dir/Casks/"
            cp Formula/*.rb "$tap_dir/Formula/"
            brew readall --os=sequoia --arch=all batkiz/backit
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- Casks Formula
            git commit -m 'Update Homebrew packages'
            git push origin HEAD:"$GITHUB_REF_NAME_DEFAULT"
          fi
          exit "$failed"
        env:
          GITHUB_REF_NAME_DEFAULT: ${{ github.event.repository.default_branch }}
